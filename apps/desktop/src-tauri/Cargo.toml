[package]
name = "brickellstatus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BrickellStatus desktop and tray application"
default-run = "brickellstatus-desktop"

[lib]
name = "brickellstatus_desktop_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
brickellstatus-collectors = { path = "../../../crates/collectors" }
brickellstatus-projection = { path = "../../../crates/projection" }
brickellstatus-delivery = { path = "../../../crates/delivery" }
brickellstatus-eink = { path = "../../../crates/eink" }
brickellstatus-runtime = { path = "../../../crates/runtime" }
dotenvy.workspace = true
jiff.workspace = true
espflash.workspace = true
serialport.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Present only to install the ring process-default CryptoProvider in run().
rustls.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.3.3"
# Only the Rust-side open_url free function is used; the plugin is never
# registered, so no JS invoke surface or capability is added.
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
brickellstatus-storage = { path = "../../../crates/storage" }
url.workspace = true
uuid.workspace = true

# DPAPI keeps credentials.json unreadable off this machine and user account.
# All three crates are already in Cargo.lock transitively, so this section
# adds no new supply-chain surface.
[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# `start_paused` lets the broker's hold and preemption timing be asserted in
# milliseconds of wall clock rather than by actually waiting 45 seconds.
tokio = { workspace = true, features = ["test-util"] }
