[workspace]
members = ["crates/*", "apps/desktop/src-tauri", "apps/hub"]
resolver = "3"

[workspace.package]
version = "0.1.32"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["BrickellStatus contributors"]
repository = "https://github.com/cmiami/BrickellStatus"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
dotenvy = "0.15.7"
# The CLI feature pulls clap, indicatif, and a terminal stack this app has no
# use for; "serialport" is the flashing transport and is all that is needed.
espflash = { version = "4.5.0", default-features = false, features = ["serialport"] }
feed-rs = "2.4.0"
futures = "0.3.31"
image = { version = "0.25.8", default-features = false, features = ["png"] }
jiff = { version = "0.2.32", features = ["serde"] }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "query", "gzip", "brotli"] }
# Provider-free rustls: the default aws-lc-sys provider needs a CMake/C build
# that does not cross-compile to windows-msvc, so the desktop app installs
# ring as the process-wide default at startup and every client resolves it.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
scraper = "0.27.0"
serialport = "4.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "json", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }
zeroize = "1.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.sqlx-macros]
opt-level = 3
