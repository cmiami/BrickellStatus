[package]
name = "brickellstatus-eink"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "BrickellStatus monochrome renderer and E213/E290 USB/BLE transport"

[features]
# Talking to a physical panel. On by default so every existing consumer is
# unchanged; switched off, this crate is pure computation that builds for
# wasm32-unknown-unknown, which is what lets the hosted service render frames
# with the same code the desktop app uses.
default = ["hardware"]
hardware = [
  "dep:async-trait",
  "dep:btleplug",
  "dep:futures",
  "dep:tokio",
  "dep:tokio-serial",
  "dep:tracing",
  "dep:uuid",
]

[dependencies]
# Rendering, protocol and preview: pure, and portable anywhere.
crc32fast.workspace = true
embedded-graphics = "0.8.1"
image.workspace = true
serde.workspace = true
thiserror.workspace = true

# Transport only. Each of these reaches an operating system — a Bluetooth
# stack, a serial port, a threaded runtime — and none of them exist on wasm.
async-trait = { workspace = true, optional = true }
btleplug = { version = "0.12.0", optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-serial = { version = "5.5.0", optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
