[package]
name = "brickellstatus-eink"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "BrickellStatus monochrome renderer and E213/E290 USB/BLE transport"
# Internal to this application: never published, and the path dependencies
# between these crates could not be published anyway.
publish = false

[features]
# Talking to a physical panel. On by default so every existing consumer is
# unchanged; switched off, this crate is pure computation that builds for
# wasm32-unknown-unknown, which is what lets the hosted service render frames
# with the same code the desktop app uses.
default = ["hardware"]
hardware = ["ble", "usb"]
# The two paths are separable because Android has one and not the other: an
# unrooted app cannot open /dev/tty*, so the phone build takes "ble" alone and
# leaves the serial stack -- which links libudev -- out of the graph entirely.
ble = ["_transport", "dep:btleplug"]
usb = ["_transport", "dep:tokio-serial"]
# Plumbing both paths share. Not meant to be selected on its own; it exists so
# "ble" and "usb" can each pull it without duplicating the list.
_transport = [
  "dep:async-trait",
  "dep:futures",
  "dep:tokio",
  "dep:tracing",
  "dep:uuid",
]

[dependencies]
# Rendering, protocol and preview: pure, and portable anywhere.
crc32fast.workspace = true
embedded-graphics = "0.8.1"
image.workspace = true
serde.workspace = true
thiserror.workspace = true

# Transport only. Each of these reaches an operating system — a Bluetooth
# stack, a serial port, a threaded runtime — and none of them exist on wasm.
async-trait = { workspace = true, optional = true }
btleplug = { version = "0.12.0", optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-serial = { version = "5.5.0", optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# The only example that reaches a board rather than a PNG. Naming the feature
# it needs keeps `--no-default-features` builds of this crate checkable, which
# is the whole point of the transport features being separable.
[[example]]
name = "send_channel_cards"
required-features = ["usb"]

# btleplug's Android backend needs an explicit init handshake before first use,
# and the caller has to hand it a `&JNIEnv` of the exact jni version btleplug
# compiles against. Owning that dependency here -- and re-exporting it -- makes
# a version mismatch structurally impossible for callers.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
sha2.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
