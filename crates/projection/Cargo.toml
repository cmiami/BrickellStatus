[package]
name = "brickellstatus-projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Projects a runtime snapshot into the shapes the e-paper renderer draws"
# Internal to this application: never published, and the path dependencies
# between these crates could not be published anyway.
publish = false

[dependencies]
brickellstatus-runtime = { path = "../runtime" }
brickellstatus-eink = { path = "../eink", default-features = false }
jiff.workspace = true
serde_json.workspace = true

[lints.rust]
missing_docs = "allow"
unsafe_code = "forbid"
