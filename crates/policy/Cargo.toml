[package]
name = "bridgestatus-policy"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Explainable signal policy and Brickell bridge prediction"

[dependencies]
bridgestatus-model = { path = "../model" }
jiff = { version = "=0.2.32", features = ["serde"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
