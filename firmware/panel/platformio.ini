[platformio]
default_envs = vision-master-e213-v11

[env]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#9207eb6ab2b96f66298e0488740218c17b006af7
  https://github.com/h2zero/NimBLE-Arduino.git#a17bec675cd421a5f83bb5fe266fd5b498990aa4
; BRICKELLSTATUS_BUILD_ID and the monotonic firmware version are injected by
; scripts/build_id.py. The version decides upgrade ordering; the source build
; identifies the exact bytes without pretending Git hashes are orderable.
extra_scripts = pre:scripts/build_id.py
build_flags =
  -D ARDUINO_USB_MODE=1
  -D BRICKELLSTATUS_ENABLE_BLE=1
  -D CORE_DEBUG_LEVEL=1

; The app chooses a firmware image from the detected PCB connection, never from
; a reader-facing revision picker. Vision Master controller classes remain
; compile-time builds; Wireless Paper selects its supported controller at boot.
[env:vision-master-e213]
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DISABLE_SDCARD
  -D Vision_Master_E213
  -D BRICKELLSTATUS_PANEL_V11=0

[env:vision-master-e213-v11]
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DISABLE_SDCARD
  -D Vision_Master_E213
  -D BRICKELLSTATUS_PANEL_V11=1

[env:vision-master-e290]
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DISABLE_SDCARD
  -D Vision_Master_E290

; Wireless Paper uses the same 250x122 framebuffer as E213 but a different
; pinout and an active-LOW Vext rail. Its USB-C connector terminates at a CP2102
; bridge wired to UART0, so this build deliberately does not enable native USB
; CDC: Serial must remain on UART0 for READY/INK1 traffic after flashing.
;
; One image covers the supported Wireless Paper revisions. At boot it uses
; Heltec's 0x2F controller query to select LCMEN2R13EFC1 (V1.1) or E0213A367
; (V1.1.1/V1.2), so the reader never chooses a display revision. Original V1.0
; uses SSD1680, which returns the same public 0x2F ID bits as E0213A367; it is
; deliberately not guessed from undocumented OTP contents.
[env:wireless-paper]
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
build_flags =
  ${env.build_flags}
  -D WIRELESS_PAPER
  -D BRICKELLSTATUS_WIRELESS_PAPER
