# What may enter this repository's dependency tree, checked in CI against the
# committed lockfile so the verdict applies to exactly what ships.

[advisories]
# An advisory in a shipped dependency fails the build. Dependabot proposes the
# bump; this is what makes ignoring one a deliberate act rather than an
# oversight. Add an entry to `ignore` with a reason if a fix is genuinely
# unavailable, so the exception is reviewed rather than silent.
yanked = "deny"

# Vulnerabilities fail the build. "Unmaintained" is scoped to crates this
# workspace chose directly, because the sixteen that fire otherwise are all
# gtk-rs GTK3 bindings reached through Tauri's Linux webview stack: nothing in
# this repository selects them, no newer version exists, and Tauri v2 is built
# on GTK3. A gate that is red on every run for something unfixable here trains
# everyone to ignore it, which costs more than it catches.
unmaintained = "workspace"

ignore = [
  # Unsoundness in glib's VariantStrIter, same transitive GTK3 stack. This
  # workspace never constructs a glib Variant; the path is inside Tauri's
  # webview plumbing. Revisit when Tauri moves off GTK3.
  { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter, transitive via tauri's GTK3 stack; not reachable from this workspace" },
]

[licenses]
# The project ships its dependencies' licence texts inside every artifact
# (THIRD_PARTY_NOTICES.md and the bundled licences resource), so a new licence
# arriving unnoticed is a distribution problem, not only a legal one.
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "OpenSSL",
]

[bans]
# Duplicate major versions are noise in a tree this size and are usually not
# actionable from here, so they are reported rather than fatal.
multiple-versions = "warn"
# A wildcard on a published crate is a real supply-chain hazard; on the
# `path = "../../crates/..."` members of this workspace it is just how a
# workspace refers to itself, so those are exempt rather than the check waived.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Every dependency comes from crates.io today, and a git or alternate-registry
# source appearing without discussion is exactly the supply-chain change worth
# stopping a build for.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
