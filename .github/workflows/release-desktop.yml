name: macOS DMGs (unsigned)

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ref:
    name: Verify release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/console/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} DMG
    needs: verify-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the firmware build id is the last commit that
          # touched firmware sources. A shallow checkout has no parent to compare
          # against, so git attributes every path to the tip commit and the id
          # becomes the release sha -- changing on every release, marking every
          # device outdated, and offering a reflash that writes identical bytes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # The app bundles the firmware it flashes, so the release has to build it.
      # Building here rather than committing the .bin files keeps the build id
      # the device reports honest: a committed binary can drift from main.cpp,
      # and the device would then confidently name a build it is not running.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/e213/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.18

      - name: Build E213 firmware
        run: python3 firmware/e213/scripts/bundle_firmware.py

      # `rustup target add --toolchain` assumes that toolchain is already
      # present and intact. When a runner image ships a partial 1.97.1 the step
      # dies with "Missing manifest in toolchain", which is exactly what took
      # out the Apple Silicon leg on 2026-08-15 while the identical step had
      # passed hours earlier. Installing it explicitly first makes the build
      # independent of whatever Rust the image happens to carry.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.97.1
          rustup run 1.97.1 rustc --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build unsigned DMG
        run: >-
          npm --prefix apps/console run tauri:build:mac --
          --target "${{ matrix.target }}"

      - name: Name and checksum artifact
        env:
          VERSION: ${{ needs.verify-ref.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/$TARGET/release/bundle"
          bundle_dir="$bundle_root/dmg"
          dmg="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG found in $bundle_dir" >&2
            exit 1
          fi
          mkdir -p dist
          output="dist/Tenders-Log_${VERSION}_${ARCH}.dmg"
          cp "$dmg" "$output"
          node apps/console/scripts/check-macos-artifact-size.mjs "$bundle_root" \
            | tee "dist/Tenders-Log_${VERSION}_${ARCH}.sizes.txt"
          (cd dist && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tag assets
    if: github.event_name == 'push'
    needs: [verify-ref, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tender's Log $GITHUB_REF_NAME" \
              --generate-notes
          fi
