# Named for what it produces rather than for the desktop alone: the Android
# APKs it now also builds are signed, unlike every desktop artifact here.
name: Release installers

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ref:
    name: Verify release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/console/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} DMG
    needs: verify-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the firmware build id is the last commit that
          # touched firmware sources. A shallow checkout has no parent to compare
          # against, so git attributes every path to the tip commit and the id
          # becomes the release sha -- changing on every release, marking every
          # device outdated, and offering a reflash that writes identical bytes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # The app bundles the firmware it flashes, so the release has to build it.
      # Building here rather than committing the .bin files keeps the build id
      # the device reports honest: a committed binary can drift from main.cpp,
      # and the device would then confidently name a build it is not running.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.18

      - name: Build panel firmware
        run: python3 firmware/panel/scripts/bundle_firmware.py

      # `rustup target add --toolchain` assumes that toolchain is already
      # present and intact. When a runner image ships a partial 1.97.1 the step
      # dies with "Missing manifest in toolchain", which is exactly what took
      # out the Apple Silicon leg on 2026-08-15 while the identical step had
      # passed hours earlier. Installing it explicitly first makes the build
      # independent of whatever Rust the image happens to carry.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.97.1
          rustup run 1.97.1 rustc --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build unsigned DMG
        run: >-
          npm --prefix apps/console run tauri:build:mac --
          --target "${{ matrix.target }}"

      - name: Name and checksum artifact
        env:
          VERSION: ${{ needs.verify-ref.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/$TARGET/release/bundle"
          bundle_dir="$bundle_root/dmg"
          dmg="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG found in $bundle_dir" >&2
            exit 1
          fi
          mkdir -p dist
          output="dist/BrickellStatus_${VERSION}_macos-${ARCH}.dmg"
          cp "$dmg" "$output"
          node apps/console/scripts/check-macos-artifact-size.mjs "$bundle_root" \
            | tee "dist/BrickellStatus_${VERSION}_macos-${ARCH}.sizes.txt"
          (cd dist && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The Windows executable and NSIS installer are cross-compiled on a macOS
  # runner (cargo-xwin + clang-cl + makensis), mirroring the documented local
  # workflow in docs/WINDOWS_RELEASE.md, so releases never depend on a Windows
  # machine. WiX/MSI would; NSIS is the only bundler that crosses.
  build-windows:
    name: Windows x64 installer
    needs: verify-ref
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "true"
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the firmware build id; see the macOS job above.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.18

      - name: Build panel firmware
        run: python3 firmware/panel/scripts/bundle_firmware.py

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-msvc --toolchain 1.97.1
          rustup run 1.97.1 rustc --version

      - name: Install the Windows cross toolchain
        run: |
          set -euo pipefail
          brew install nsis llvm
          cargo install --locked cargo-xwin --version 0.23.1

      # The MSVC CRT and Windows SDK that xwin downloads on first use.
      - name: Cache the xwin SDK splat
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/cargo-xwin
          key: cargo-xwin-0.23.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-x86_64-pc-windows-msvc

      - name: Cross-build unsigned NSIS installer
        run: npm --prefix apps/console run tauri:build:win

      - name: Name and checksum artifact
        env:
          VERSION: ${{ needs.verify-ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="target/x86_64-pc-windows-msvc/release"
          installer="$(find "$release_root/bundle/nsis" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          if [[ -z "$installer" ]]; then
            echo "No NSIS installer found in $release_root/bundle/nsis" >&2
            exit 1
          fi
          mkdir -p dist
          output="dist/BrickellStatus_${VERSION}_windows-x64-setup.exe"
          cp "$installer" "$output"
          node apps/console/scripts/check-windows-artifact-size.mjs "$release_root" \
            | tee "dist/BrickellStatus_${VERSION}_windows-x64-setup.sizes.txt"
          (cd dist && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The Fedora package is the one artifact that cannot be cross-built: it links
  # the host's WebKitGTK, libudev and libdbus, and it names its runtime
  # dependencies as Fedora packages. So it is built on Fedora, in a container,
  # because GitHub offers no Fedora runner. See docs/FEDORA_RELEASE.md.
  build-linux:
    name: Fedora 44 x86_64 RPM
    needs: verify-ref
    runs-on: ubuntu-latest
    # Pinned by digest, like every action here. Refresh with:
    #   docker buildx imagetools inspect fedora:44 --format '{{.Manifest.Digest}}'
    container: fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      # dnf before checkout: the Fedora image has no git for actions/checkout to
      # call. The list is explained in ci.yml's fedora-linux job.
      - name: Install build and runner dependencies
        run: |
          set -euo pipefail
          dnf -y install \
            git tar gzip xz zstd findutils which ca-certificates \
            gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel systemd-devel dbus-devel \
            libayatana-appindicator-gtk3-devel \
            rustup python3.13 python3-pip python-pip-wheel
          dnf clean all
          # bundle_firmware.py derives the firmware build id by shelling out to
          # git. In a container the mounted workspace can trip git's
          # dubious-ownership guard, and it would surface as a build-id failure
          # rather than as anything git-shaped.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the firmware build id; see the macOS job above.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-fedora44-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-fedora44-

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          python3.13 -m venv /opt/platformio
          /opt/platformio/bin/python -m pip install --upgrade pip
          /opt/platformio/bin/python -m pip install platformio==6.1.18
          echo "/opt/platformio/bin" >> "$GITHUB_PATH"

      - name: Build panel firmware
        run: python3 firmware/panel/scripts/bundle_firmware.py

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-fedora44

      - name: Build unsigned RPM
        run: npm --prefix apps/console run tauri:build:linux

      - name: Name and checksum artifact
        env:
          VERSION: ${{ needs.verify-ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="target/release/bundle/rpm"
          package="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No RPM found in $bundle_dir" >&2
            exit 1
          fi
          mkdir -p dist
          output="dist/BrickellStatus_${VERSION}_fedora44-x86_64.rpm"
          cp "$package" "$output"
          node apps/console/scripts/check-linux-artifact-size.mjs target/release \
            | tee "dist/BrickellStatus_${VERSION}_fedora44-x86_64.sizes.txt"
          (cd dist && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Android is built on Linux because GitHub's ubuntu image already carries the
  # SDK and a pinned NDK, so unlike the Windows leg there is nothing to
  # cross-compile around. Note there is no `fetch-depth: 0` here: that exists on
  # the other jobs so the firmware build id can be derived from git history, and
  # this build deliberately bundles no firmware.
  build-android:
    name: Android APK
    needs: verify-ref
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # Pinned rather than taken from the image default, which drifts. The
      # Android Gradle Plugin supports 17 and 21; it rejects 25.
      - name: Set up the JDK Gradle runs on
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add aarch64-linux-android armv7-linux-androideabi --toolchain 1.97.1
          rustup run 1.97.1 rustc --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-android

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/gen/android/**/*.gradle*', 'apps/desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The keystore never exists in the repository. A fork holds no secrets and
      # still gets an unsigned release APK, which is deliberate; this repository
      # publishes what it builds, so a missing secret here is a release-stopping
      # error rather than a warning. v0.1.27 through v0.1.32 shipped unsigned and
      # uninstallable APKs because this step only warned and the job stayed green.
      - name: Materialise the release keystore
        env:
          IS_FORK: ${{ github.event.repository.fork }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            if [[ "${IS_FORK:-false}" == "true" ]]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret on a fork; building an unsigned release APK."
              exit 0
            fi
            echo "No ANDROID_KEYSTORE_BASE64 secret. Android release artifacts must be signed;" >&2
            echo "an unsigned APK cannot be installed at all. Set the signing secrets or" >&2
            echo "remove the Android leg from this release." >&2
            exit 1
          fi
          for required in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "ANDROID_KEYSTORE_BASE64 is set but $required is missing." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          cat > apps/desktop/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # NDK_HOME is what the Tauri CLI reads. ANDROID_NDK_HOME is the image's
      # pinned default; ANDROID_NDK_LATEST_HOME floats and is avoided so a
      # runner image update cannot silently change compiler.
      - name: Build signed APKs
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_NDK_HOME"
          npm --prefix apps/console run tauri:android:build

      - name: Name and checksum artifacts
        env:
          VERSION: ${{ needs.verify-ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          outputs="apps/desktop/src-tauri/gen/android/app/build/outputs/apk"
          mkdir -p dist
          # arm64-v8a and armeabi-v7a only: x86 and x86_64 are emulator targets,
          # and a universal APK carrying all four would blow the size budget.
          declare -A abis=([arm64]=arm64-v8a [arm]=armeabi-v7a)
          for abi in "${!abis[@]}"; do
            apk="$(find "$outputs/$abi/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            if [[ -z "$apk" ]]; then
              echo "No APK for $abi in $outputs/$abi/release" >&2
              exit 1
            fi
            output="dist/BrickellStatus_${VERSION}_android-${abis[$abi]}.apk"
            cp "$apk" "$output"
            (cd dist && shasum -a 256 "$(basename "$output")" > "$(basename "$output").sha256")
          done
          node apps/console/scripts/check-android-artifact-size.mjs "$outputs" \
            | tee "dist/BrickellStatus_${VERSION}_android.sizes.txt"

      # Both release-only failures this gate exists for shipped in v0.1.32, and
      # neither was visible to any earlier check: the compile gate in ci.yml never
      # runs Gradle, and the Pixel verification behind the Android port was a debug
      # build -- unminified and debug-signed. So assert against the artifact that is
      # about to be published rather than against the inputs that produced it.
      - name: Verify the release APKs
        if: ${{ github.event.repository.fork != true }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "$apksigner" ]]; then
            echo "No apksigner under $ANDROID_SDK_ROOT/build-tools" >&2
            exit 1
          fi
          dexdump="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name dexdump | sort -V | tail -1)"
          if [[ -z "$dexdump" ]]; then
            echo "No dexdump under $ANDROID_SDK_ROOT/build-tools" >&2
            exit 1
          fi
          work="$(mktemp -d)"
          for apk in dist/*.apk; do
            echo "== $apk"

            # An unsigned APK installs nowhere, so this is fatal rather than cosmetic.
            "$apksigner" verify --print-certs "$apk"

            # R8 renames or strips anything it sees no caller for, and a JNI lookup
            # by name is not a caller it can see. Every method Rust resolves that way
            # needs a keep rule in proguard-rules.pro; assert each one survived
            # minification, because the failure is a runtime crash on a build that
            # otherwise looks healthy.
            rm -rf "$work/dex" && mkdir -p "$work/dex"
            unzip -q -o "$apk" 'classes*.dex' -d "$work/dex"
            methods="$("$dexdump" "$work"/dex/classes*.dex 2>/dev/null | grep -F "name          : '" || true)"
            for symbol in publishStatus initBluetooth initStatusBridge; do
              if ! grep -qF "'$symbol'" <<<"$methods"; then
                echo "R8 removed $symbol from $apk; it is reached only by JNI name lookup." >&2
                echo "Add a keep rule for it in gen/android/app/proguard-rules.pro." >&2
                exit 1
              fi
            done
            echo "   JNI entry points intact"
          done
          rm -rf "$work"

      # Belt and braces: the file is gitignored and lives on an ephemeral
      # runner, but a signing credential should not outlive the step that needs it.
      - name: Remove the keystore
        if: always()
        run: rm -f apps/desktop/src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tag assets
    if: github.event_name == 'push'
    needs: [verify-ref, build, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Only the installers become release assets. Size reports and checksums
      # stay behind as workflow artifacts for the release engineer.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe dist/*.rpm dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe dist/*.rpm dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "BrickellStatus $GITHUB_REF_NAME" \
              --generate-notes
          fi
