name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, console, and Tauri shell
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # tauri.conf.json declares resources/licenses as a bundle resource, and the
      # Tauri build script fails if it is missing. The directory is generated, not
      # committed, so every cargo command that builds the desktop crate needs it
      # to exist first -- including `cargo test`, long before the Tauri build step
      # runs its own beforeBuildCommand.
      - name: Generate bundled license texts
        run: npm --prefix apps/console run licenses:bundle

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check and test console
        run: |
          npm --prefix apps/console run check
          npm --prefix apps/console test

      - name: Compile production Tauri shell
        run: >-
          npm --prefix apps/console run tauri:build --
          --no-bundle --no-sign --ci
