name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust, console, and Tauri shell
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The firmware build id is derived from history; see release-desktop.yml.
          # CI builds the same bundle, so it needs the same history to stamp the
          # same identity and to exercise the manifest/image agreement test.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # The app bundles the firmware it flashes, so the release has to build it.
      # Building here rather than committing the .bin files keeps the build id
      # the device reports honest: a committed binary can drift from main.cpp,
      # and the device would then confidently name a build it is not running.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.18

      - name: Build panel firmware
        run: python3 firmware/panel/scripts/bundle_firmware.py

      # tauri.conf.json points at three paths that are generated rather than
      # committed: `frontendDist` (console/build) and the `resources/licenses`
      # and `resources/firmware` bundle resources. `generate_context!` and the Tauri build script both fail
      # when any is missing, so *any* cargo command that builds the desktop
      # crate needs them all first -- including `cargo test`, which runs long before
      # the Tauri build step invokes its own beforeBuildCommand. Every other path
      # tauri.conf.json references (icons, Info.plist, capabilities) is tracked.
      # `desktop:prepare` is exactly the beforeBuildCommand and produces all three.
      - name: Prepare generated Tauri inputs
        run: npm --prefix apps/console run desktop:prepare

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check and test console
        run: |
          npm --prefix apps/console run check
          npm --prefix apps/console test

      - name: Compile production Tauri shell
        run: >-
          npm --prefix apps/console run tauri:build --
          --no-bundle --no-sign --ci

  # The only pre-release signal that the Rust code actually *runs* on Windows:
  # the release installer is cross-compiled on macOS, and cross-compilation
  # proves compilation, not behavior (the DPAPI secret-store tests, for one,
  # execute nowhere else). Mirrors the quality job's generated-input setup.
  windows-native:
    name: Windows native tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.18

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup run 1.97.1 rustc --version

      # The firmware:bundle npm script hardcodes `python3`, which Windows
      # runners do not reliably alias, so the bundler is invoked directly.
      - name: Build panel firmware
        run: python firmware/panel/scripts/bundle_firmware.py

      # Bash, because PowerShell reports only the last command's exit code:
      # a failing bundle step would pass here and surface later as cargo
      # complaining that a generated resource path does not exist.
      - name: Prepare remaining generated Tauri inputs
        shell: bash
        run: |
          npm --prefix apps/console run licenses:bundle
          npm --prefix apps/console run build

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows-native

      - name: Test Rust workspace
        run: cargo test --workspace

  # The only pre-release signal that the Rust code builds and runs on Linux.
  # Linux is the one desktop platform whose system libraries the app links
  # against at build time -- WebKitGTK for the webview, libudev for serial-port
  # enumeration, libdbus for the tray and BlueZ bridges -- so none of it is
  # proven by the macOS or Windows legs, which link none of them. GitHub has no
  # Fedora runner, so this runs in the same container the release job uses.
  fedora-linux:
    name: Fedora 44 build, tests, and RPM
    runs-on: ubuntu-latest
    # Pinned by digest for the same reason every action here is pinned by SHA.
    # Refresh with:
    #   docker buildx imagetools inspect fedora:44 --format '{{.Manifest.Digest}}'
    container: fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    timeout-minutes: 75
    steps:
      # dnf runs before checkout because the Fedora image ships no git and
      # actions/checkout shells out to it. The rest splits three ways: what the
      # runner's own actions need (tar, gzip, xz, zstd for the caches), what
      # cargo needs to link (webkit2gtk4.1-devel, systemd-devel for libudev,
      # dbus-devel), and what builds the C dependencies sqlx and ring carry.
      #
      # Deliberately absent, against Tauri's published Fedora list: openssl-devel
      # (this workspace is rustls end to end), and libxdo-devel and
      # librsvg2-devel (no crate in Cargo.lock links either).
      #
      # libayatana-appindicator-gtk3-devel is NOT optional, for a reason that
      # is easy to reason past: libappindicator-sys 0.9 dlopens the tray
      # library, so cargo links and the binary builds without it. The Tauri
      # CLI then shells out to `pkg-config --libs-only-L
      # ayatana-appindicator3-0.1` while bundling, to record which tray
      # library the package needs, and panics with "Can't detect any
      # appindicator library" when the .pc file is missing. That is a
      # build-host requirement even though nothing links against it, and it
      # fires only after a full release compile.
      - name: Install build and runner dependencies
        run: |
          set -euo pipefail
          dnf -y install \
            git tar gzip xz zstd findutils which ca-certificates \
            gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel systemd-devel dbus-devel \
            libayatana-appindicator-gtk3-devel \
            desktop-file-utils \
            rustup python3.13 python3-pip python-pip-wheel
          dnf clean all
          # bundle_firmware.py derives the firmware build id by shelling out to
          # git. In a container the mounted workspace can trip git's
          # dubious-ownership guard, and it would surface as a build-id failure
          # rather than as anything git-shaped.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The firmware build id is derived from history; see release-desktop.yml.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # Fedora ships rustup as a package, so the toolchain arrives without
      # piping a shell script from the network. rust-toolchain.toml still
      # decides the version; this only puts rustup somewhere cargo can find it.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      # PlatformIO goes in a venv on Fedora's python3.13 rather than through
      # actions/setup-python: the pinned interpreter is already a package here,
      # and setup-python would drop an Ubuntu-built CPython into a Fedora
      # userland to run the one toolchain in this repo that is version-sensitive.
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-fedora44-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: pio-fedora44-

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          python3.13 -m venv /opt/platformio
          /opt/platformio/bin/python -m pip install --upgrade pip
          /opt/platformio/bin/python -m pip install platformio==6.1.18
          echo "/opt/platformio/bin" >> "$GITHUB_PATH"

      - name: Build panel firmware
        run: python3 firmware/panel/scripts/bundle_firmware.py

      # tauri.conf.json points at three generated paths; see the quality job.
      - name: Prepare generated Tauri inputs
        run: npm --prefix apps/console run desktop:prepare

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-fedora44

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build the unsigned RPM
        run: npm --prefix apps/console run tauri:build:linux

      - name: Check payload and size
        run: npm --prefix apps/console run size:linux

      # The single check that proves the most: `depends` in tauri.conf.json is
      # a hand-written list, because Tauri writes RPMs with the pure-Rust `rpm`
      # crate rather than rpmbuild and so never runs the automatic dependency
      # generator. A name that no longer resolves on Fedora 44 is invisible
      # until someone tries to install the release -- unless dnf tries here.
      - name: Install the package and validate its desktop entry
        run: |
          set -euo pipefail
          package="$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          # Asked of the package rather than hardcoded: Tauri derives the RPM
          # name from productName, and guessing its casing here would turn a
          # passing install into a failing query.
          name="$(rpm -qp --queryformat '%{NAME}' "$package")"
          dnf -y install "$package"
          rpm -q "$name"
          test -f /usr/lib/udev/rules.d/70-brickellstatus-espressif.rules
          entry="$(rpm -ql "$name" | grep '[.]desktop$')"
          test -n "$entry"
          desktop-file-validate "$entry"
          dnf -y remove "$name"

  # A compile-only gate. It cross-compiles the Android library and nothing else:
  # no Gradle, no APK, no emulator. That is enough to catch the failure this
  # branch can actually cause -- a #[cfg(desktop)] that no longer lines up, or a
  # dependency that stops resolving for aarch64 -- in a couple of minutes rather
  # than the half hour a full Android build costs. The `quality` job cannot host
  # this: it runs on macOS, which has no Android NDK.
  android-check:
    name: Android cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Use the locked npm release
        run: npm install --global npm@11.18.0

      - name: Install JavaScript dependencies
        run: npm --prefix apps/console ci

      # tauri::generate_context! reads console/build and resources/licenses at
      # compile time, so even a check needs them. android:prepare deliberately
      # skips the firmware bundle, which needs PlatformIO and which Android
      # cannot flash anyway -- and it verifies the vendored droidplug Java still
      # matches the btleplug the lockfile resolves.
      - name: Prepare generated Tauri inputs
        run: npm --prefix apps/console run android:prepare

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add aarch64-linux-android --toolchain 1.97.1
          rustup run 1.97.1 rustc --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-android

      # ANDROID_NDK_HOME is the image's pinned default (27.x); ANDROID_NDK_LATEST_HOME
      # floats and is deliberately not used, so this job does not change compiler
      # under us when the runner image updates.
      - name: Cross-compile the Android library
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export RANLIB_aarch64_linux_android="$toolchain/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo clippy -p brickellstatus-desktop --lib \
            --target aarch64-linux-android -- -D warnings

  # Dependabot proposes version bumps; nothing until now failed a build because
  # a pinned dependency had a published advisory. These two jobs are the gate:
  # they read the committed lockfiles, so what they judge is exactly what ships.
  #
  # Split from `quality` deliberately. An advisory is not a code defect and its
  # fix is usually a lockfile bump by someone else, so it should be legible as
  # its own red mark rather than buried in a job that also compiles Rust.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      # `npm audit` without an install: the lockfile is the whole input, and
      # installing first would run the very packages being judged. --omit=dev
      # keeps the gate on what actually ships in the app; a advisory in a build
      # tool is worth knowing about but is not a user-facing vulnerability.
      - name: Audit JavaScript dependencies
        run: npm --prefix apps/console audit --audit-level=high --omit=dev

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup run 1.97.1 rustc --version

      # cargo-deny rather than cargo-audit: it reads the same RustSec database
      # and also refuses a licence this project cannot ship, which matters for
      # a repository that bundles its dependencies' licence texts into every
      # artifact and would otherwise notice a change only by reading them.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.18.6

      - name: Check advisories, licences, and sources
        run: cargo deny --all-features check
