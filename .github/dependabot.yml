version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/console
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    # Majors stay separate so a breaking bump is reviewed on its own.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 3
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
