version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/console
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    # Majors stay separate so a breaking bump is reviewed on its own.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    # jni is not ours to choose: `init_android_bluetooth` hands the `JNIEnv`
    # straight to `btleplug::platform::init`, so the version has to be the one
    # btleplug itself compiles against, currently 0.19. 0.22 split `JNIEnv`
    # into `Env` and `EnvUnowned`, which fails the Android cross-compile with a
    # type mismatch rather than anything Dependabot can see. Unpin this when
    # btleplug moves, not before.
    ignore:
      - dependency-name: jni
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 3
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
