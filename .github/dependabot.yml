version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/console
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    reviewers:
      - cmiami
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 2
    open-pull-requests-limit: 3
    reviewers:
      - cmiami
    commit-message:
      prefix: deps
